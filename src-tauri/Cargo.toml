[package]
name = "tauronic"
version = "0.1.0"
description = "展厅双端地图"
edition = "2021"

[lib]
name = "tauronic_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "fs", "io-util", "time", "process", "signal"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
gb28181-rs = "0.15"
md-5 = "0.10"
hex = "0.4"


[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.39"
windows-core = "0.62"
