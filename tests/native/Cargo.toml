[package]
name = "exhibition-resource-test-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "fs", "io-util", "time"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
