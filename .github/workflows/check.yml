name: 双端项目检查
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: node scripts/check-xcode-format.mjs
      - run: pnpm build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            tests/native -> target
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: 原图读取与缓存回归测试
        run: cargo test --manifest-path tests/native/Cargo.toml --locked
      - name: 准备内置图片处理器
        run: ./scripts/prepare-vips.ps1
      - name: 空安装目录放入原图后就绪，替换原图后重建缓存
        shell: pwsh
        run: |
          cargo build --manifest-path tests/native/Cargo.toml --locked
          $env:E2E_NATIVE_BINARY = "$PWD/tests/native/target/debug/exhibition-resource-test-server.exe"
          $env:VIPS_BIN = "$PWD/src-tauri/tools/vips/bin/vips.exe"
          node scripts/check-native-originals.mjs
          node scripts/check-resource-progress.mjs
      - run: pnpm tauri build --bundles nsis
      - name: 安装 Windows 成品并测试 iPad 控制端连接与图片加载
        shell: pwsh
        run: |
          pnpm exec playwright install chromium
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          ./scripts/test-windows-native.ps1 -Installer $installer
      - name: 保存 Windows 原生端到端测试证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-e2e
          path: tmp/e2e/
      - uses: actions/upload-artifact@v4
        with:
          name: Windows安装包
          path: src-tauri/target/release/bundle/nsis/*.exe

  ios-connection:
    name: iPad 连接与真实瓦片加载
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/native -> ../../tmp/native-test-target
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: brew install vips xcodegen
      - name: 编译生产资源与同步服务的测试入口
        run: CARGO_TARGET_DIR="$PWD/tmp/native-test-target" cargo build --manifest-path tests/native/Cargo.toml --locked
      - name: 原图只读、不同尺寸和同名替换回归测试
        run: |
          export E2E_NATIVE_BINARY="$PWD/tmp/native-test-target/debug/exhibition-resource-test-server"
          node scripts/check-native-originals.mjs
          node scripts/check-resource-progress.mjs
      - name: WebKit iPad 控制端端到端测试
        run: |
          pnpm build
          pnpm exec playwright install webkit
          export E2E_NATIVE_BINARY="$PWD/tmp/native-test-target/debug/exhibition-resource-test-server"
          pnpm exec playwright test --project=webkit-ipad
      - name: 编译真正的 iPad 应用
        run: |
          if [[ "$(uname -m)" == arm64 ]]; then target=aarch64-sim; else target=x86_64; fi
          pnpm exec tauri ios build --ci --no-sign --target "$target"
      - name: iPad 模拟器操作连接、读取目录、加载十一张图片瓦片
        run: bash scripts/check-ios-connection.sh
      - name: 保存 iPad 界面、网络请求与 XCTest 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-connection-e2e
          path: |
            tmp/e2e/
            tmp/ios-connection/

  # macOS runner 可在没有本地 Mac 的情况下编译 iOS 工程。
  # 这个 job 编译 Simulator 版本，不需要 Apple Developer 账号。
  ios-ipa:
    name: iOS IPA 构建（不签名）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 校验 Xcode 工程和权限配置
        run: plutil -lint src-tauri/gen/apple/tauronic.xcodeproj/project.pbxproj src-tauri/gen/apple/tauronic_iOS/Info.plist
      - name: 构建 iOS IPA（不签名）
        run: pnpm exec tauri ios build --ci --no-sign --target aarch64
      - name: 定位 IPA
        id: ipa
        run: |
          IPA_PATH="$(find src-tauri -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-unsigned
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
